<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniyar Kalykov — Grand Stock</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #C9A84C; --gold-light: #E2C47A; --dark: #0D0D0D;
    --dark2: #151515; --dark3: #1E1E1E; --text: #F0EDE8; --muted: #7A7570;
  }
  body { min-height: 100vh; background: var(--dark); display: flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; overflow: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 60% 50% at 20% 50%, rgba(201,168,76,0.06) 0%, transparent 70%), radial-gradient(ellipse 40% 60% at 80% 30%, rgba(201,168,76,0.04) 0%, transparent 60%); pointer-events: none; }
  .card { width: min(420px, 95vw); background: var(--dark2); border: 1px solid rgba(201,168,76,0.2); border-radius: 2px; padding: 48px 40px 40px; position: relative; animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) both; box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 40px 80px rgba(0,0,0,0.6), 0 0 60px rgba(201,168,76,0.04); }
  .card::before, .card::after { content: ''; position: absolute; width: 20px; height: 20px; border-color: var(--gold); border-style: solid; }
  .card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .card::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  .logo-area { display: flex; align-items: center; gap: 10px; margin-bottom: 36px; animation: fadeUp 0.8s 0.1s cubic-bezier(0.16,1,0.3,1) both; }
  .logo-mark { width: 32px; height: 32px; border: 1.5px solid var(--gold); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; color: var(--gold); letter-spacing: 0.05em; flex-shrink: 0; }
  .company-name { font-size: 11px; font-weight: 500; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); }
  .divider { width: 40px; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); margin-bottom: 28px; animation: expandW 0.8s 0.3s cubic-bezier(0.16,1,0.3,1) both; }
  .name { font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 300; color: var(--text); line-height: 1.1; letter-spacing: 0.02em; margin-bottom: 8px; animation: fadeUp 0.8s 0.2s cubic-bezier(0.16,1,0.3,1) both; }
  .title { font-size: 10px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 36px; animation: fadeUp 0.8s 0.25s cubic-bezier(0.16,1,0.3,1) both; }
  .contacts { display: flex; flex-direction: column; gap: 0; }
  .contact-item { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); text-decoration: none; color: inherit; cursor: pointer; transition: all 0.2s; animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both; }
  .contact-item:last-child { border-bottom: none; }
  .contact-item:hover .contact-label { color: var(--gold-light); }
  .contact-item:hover .icon-wrap { border-color: var(--gold-light); }
  .contact-item:hover .icon-wrap svg { stroke: var(--gold-light); }
  .contact-item:nth-child(1) { animation-delay: 0.35s; }
  .contact-item:nth-child(2) { animation-delay: 0.42s; }
  .icon-wrap { width: 34px; height: 34px; border: 1px solid rgba(201,168,76,0.3); border-radius: 2px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: border-color 0.2s; }
  .icon-wrap svg { width: 15px; height: 15px; stroke: var(--gold); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.2s; }
  .contact-info { flex: 1; }
  .contact-type { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .contact-label { font-size: 13.5px; font-weight: 400; color: var(--text); letter-spacing: 0.01em; transition: color 0.2s; }
  .save-btn { margin-top: 32px; width: 100%; padding: 14px; background: transparent; border: 1px solid rgba(201,168,76,0.4); color: var(--gold); font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; cursor: pointer; transition: all 0.25s; animation: fadeUp 0.6s 0.55s cubic-bezier(0.16,1,0.3,1) both; position: relative; overflow: hidden; }
  .save-btn::before { content: ''; position: absolute; inset: 0; background: rgba(201,168,76,0.08); transform: translateX(-100%); transition: transform 0.3s; }
  .save-btn:hover::before { transform: translateX(0); }
  .save-btn:hover { border-color: var(--gold); }
  .save-btn:active { transform: scale(0.98); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes expandW { from { width: 0; opacity: 0; } to { width: 40px; opacity: 1; } }
</style>
</head>
<body>
<div class="card">
  <div class="logo-area">
    <div class="logo-mark">GS</div>
    <span class="company-name">Grand Stock</span>
  </div>
  <div class="name">Daniyar<br>Kalykov</div>
  <div class="title">Product Manager</div>
  <div class="divider"></div>
  <div class="contacts">
    <a class="contact-item" href="mailto:Daniyar.Kalykov@grand-stock.kz">
      <div class="icon-wrap"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg></div>
      <div class="contact-info">
        <div class="contact-type">Email</div>
        <div class="contact-label">Daniyar.Kalykov@grand-stock.kz</div>
      </div>
    </a>
    <a class="contact-item" href="tel:+87002442919">
      <div class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg></div>
      <div class="contact-info">
        <div class="contact-type">Phone / WhatsApp</div>
        <div class="contact-label">+7 700 244 2919</div>
      </div>
    </a>
  </div>
  <button class="save-btn" onclick="saveContact()">Save Contact</button>
</div>
<script>
function saveContact() {
  const vcard = ['BEGIN:VCARD','VERSION:3.0','FN:Daniyar Kalykov','N:Kalykov;Daniyar;;;','ORG:Grand Stock','TITLE:Product Manager','EMAIL:Daniyar.Kalykov@grand-stock.kz','TEL;TYPE=CELL:+87002442919','END:VCARD'].join('\n');
  const blob = new Blob([vcard], { type: 'text/vcard' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'Daniyar_Kalykov.vcf'; a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
